<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor SIG EPAS - Fase Piloto - Leandro Sanchez</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://ppete2.github.io/Leaflet.PolylineMeasure/Leaflet.PolylineMeasure.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-minimap/3.6.1/Control.MiniMap.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; }
        #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 1s ease-out; }
        #intro-video { width: 100%; height: 100%; object-fit: cover; }
        header { background-color: #004b87; color: white; padding: 10px 20px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 1000; }
        header img { height: 50px; margin-right: 20px; background-color: white; border-radius: 4px; padding: 2px; }
        header h1 { margin: 0; font-size: 1.5rem; font-weight: 500; }
        #map { flex-grow: 1; width: 100%; }
        .coord-control { background-color: rgba(255, 255, 255, 0.9); padding: 5px 10px; border: 2px solid rgba(0,0,0,0.2); border-radius: 4px; font-size: 13px; font-weight: bold; color: #333; }
        .leaflet-popup-content { font-family: 'Segoe UI', sans-serif; font-size: 13px; min-width: 200px; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <video id="intro-video" autoplay muted playsinline>
            <source src="intro.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var splashScreen = document.getElementById('splash-screen');
            var introVideo = document.getElementById('intro-video');

            function ocultarSplash() {
                if (splashScreen.style.display === 'none') return; 
                splashScreen.style.opacity = '0';
                setTimeout(function() { splashScreen.style.display = 'none'; }, 1000);
            }

            if (introVideo) {
                introVideo.addEventListener('ended', ocultarSplash);
                introVideo.addEventListener('error', ocultarSplash);
            }
            splashScreen.addEventListener('click', ocultarSplash);
            setTimeout(ocultarSplash, 6000);
        });
    </script>

    <header>
        <img src="image_5f1990.png" alt="Logo EPAS">
        <h1>Visor SIG EPAS - Fase Piloto - Leandro Sanchez</h1>
    </header>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://ppete2.github.io/Leaflet.PolylineMeasure/Leaflet.PolylineMeasure.js"></script>
    <script src="https://unpkg.com/leaflet.browser.print/dist/leaflet.browser.print.min.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-minimap/3.6.1/Control.MiniMap.js"></script>

    <script>
        var map = L.map('map').setView([-38.97899, -68.01443], 16);
        
        var osmBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { 
            maxZoom: 19, attribution: 'Tiles © Esri' 
        }); // Le sacamos el .addTo(map)
        
        var googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { 
            maxZoom: 20 
        }).addTo(map); // Y se lo ponemos a Google Satélite
        
        // =========================================================================
        // CARGA ESTÁTICA DEL ORTOMOSAICO (Desvinculado de GeoServer)
        // =========================================================================
        var ortomosaico = L.tileLayer('tiles_orto/{z}/{x}/{y}.png', {
            minZoom: 14,
            maxZoom: 21,
            tms: false,
            attribution: 'Procesamiento: Lea topcad'
        });

        var baseMaps = {
            "Google Satélite": googleSat,
            "Plano de Calles (OSM)": osmBase
        };
        var overlayMaps = {
            "Ortomosaico (Alta Resolución)": ortomosaico
        };
        var layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);

        // =========================================================================
        // CARGA NATIVA DE GEOJSON (Preparado para la web)
        // =========================================================================
        function cargarCapaGeoJSON(archivo, colorLinea, nombreMenu) {
            fetch(archivo)
                .then(response => {
                    if (!response.ok) throw new Error("No se pudo cargar " + archivo);
                    return response.json();
                })
                .then(data => {
                    var capaVector = L.geoJSON(data, {
                        style: { color: colorLinea, weight: 4, opacity: 0.9 },
                        onEachFeature: function (feature, layer) {
                            var popupContent = "<div style='min-width: 180px;'>";
                            popupContent += "<h3 style='margin: 0 0 8px 0; color: #004b87; border-bottom: 2px solid #004b87; padding-bottom: 3px;'>" + nombreMenu + "</h3>";
                            
                            // Lee dinámicamente todo lo que escribiste en QGIS
                            for (var key in feature.properties) {
                                if (feature.properties[key] !== null && feature.properties[key] !== "") {
                                    popupContent += "<b>" + key + ":</b> " + feature.properties[key] + "<br>";
                                }
                            }
                            popupContent += "</div>";
                            layer.bindPopup(popupContent);
                        }
                    }).addTo(map);
                    
                    layerControl.addOverlay(capaVector, nombreMenu);
                })
                .catch(err => console.log("Error:", err));
        }

        // Llamamos a los archivos locales
        cargarCapaGeoJSON('red_agua.geojson', '#0078FF', 'Red de Agua Potable');
        cargarCapaGeoJSON('cable_elec.geojson', '#FF8C00', 'Cable Subterráneo');

       // =========================================================================
        // HERRAMIENTAS Y CONTROLES (geoman buscar traduct al Español el lunes)
        // =========================================================================
        
        // 1. Regla de medición
        L.control.polylineMeasure({ 
            position: 'topleft', 
            unit: 'metres', 
            showBearings: true,
            measureControlTitleOn: "Activar regla para medir distancias",
            measureControlTitleOff: "Desactivar regla",
            clearControlTitle: "Limpiar todas las mediciones",
            tooltipTextFinish: "Haz clic para <b>finalizar</b>",
            tooltipTextDelete: "Presiona SHIFT y clic para <b>borrar</b> punto",
            tooltipTextMove: "Haz clic y arrastra para <b>mover</b> punto",
            tooltipTextResume: "Presiona CTRL y clic para <b>continuar</b> línea",
            tooltipTextAdd: "Presiona CTRL y clic para <b>agregar</b> punto"
        }).addTo(map);

        // 2. Impresora
        L.control.browserPrint({ 
            position: 'topleft',
            title: 'Imprimir mapa en papel o PDF'
        }).addTo(map); 

        // 3. Geolocalización (GPS)
        L.control.locate({ 
            position: 'topleft', 
            strings: { 
                title: "Mostrar mi ubicación actual",
                popup: "Estás a {distance} {unit} de este punto",
                outsideMapBoundsMsg: "Te encuentras fuera de los límites del mapa"
            } 
        }).addTo(map);

        // 4. Buscador de direcciones
        L.Control.geocoder({ 
            defaultMarkGeocode: true, 
            position: 'topleft',
            placeholder: "Buscar calle, barrio o lugar...",
            errorMessage: "No se encontró el lugar."
        }).addTo(map);

        // 5. Herramientas de Dibujo (Geoman)
        map.pm.setLang('es'); // traduce al español
        map.pm.addControls({ 
            position: 'topleft', 
            drawCircleMarker: false, 
            drawCircle: false, 
            drawText: false 
        });

        var coordControl = L.control({ position: 'bottomleft' });
        coordControl.onAdd = function() {
            this._div = L.DomUtil.create('div', 'coord-control');
            this._div.innerHTML = "Lat: 0.00000, Lng: 0.00000";
            return this._div;
        };
        coordControl.addTo(map);
        
        map.on('mousemove', function(e) {
            document.querySelector('.coord-control').innerHTML = "Lat: " + e.latlng.lat.toFixed(5) + " | Lng: " + e.latlng.lng.toFixed(5);
        });

        var osmMiniMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { minZoom: 0, maxZoom: 13 });
        new L.Control.MiniMap(osmMiniMap, { toggleDisplay: true, position: 'bottomright' }).addTo(map);

        // COORDENADAS AL PONER UN MARCADOR (PINCHE)
        // =========================================================================
        map.on('pm:create', function(e) {
            // Detectamos si lo que se dibujó fue un pinche (Marker)
            if (e.shape === 'Marker') {
                var lat = e.layer.getLatLng().lat;
                var lng = e.layer.getLatLng().lng;
                
                // Armamos el globito con la precisión solicitada
                var popupCoordenadas = "<div style='text-align: center;'>" +
                                       "<h3 style='margin: 0 0 5px 0; color: #004b87;'>Coordenada</h3>" +
                                       "<b>Lat:</b> " + lat.toFixed(6) + "<br>" +
                                       "<b>Lng:</b> " + lng.toFixed(6) +
                                       "</div>";
                                       
                e.layer.bindPopup(popupCoordenadas).openPopup();
            }
        });
    </script>
</body>
</html>
